# Company boards to poll. Greenhouse/Lever/Ashby have no global search, so each company is listed.
# The value is the board token from the careers URL:
#   greenhouse: boards.greenhouse.io/<token>
#   lever:      jobs.lever.co/<token>
#   ashby:      jobs.ashbyhq.com/<token>
# Invalid tokens are logged and skipped, so pruning this list is safe. Verify and edit freely.


name: Tailor one job on demand

# Triggered by the dashboard's "Tailor this job" button (via the trigger-tailor Edge Function,
# which fires a repository_dispatch), or manually from the Actions tab with a job UUID.
on:
  repository_dispatch:
    types: [tailor]
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job UUID to tailor"
        required: true

concurrency:
  group: tailor-${{ github.event.client_payload.job_id || inputs.job_id }}
  cancel-in-progress: false

jobs:
  tailor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tailor the job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python -m jobbit.tailor_one --job "${{ github.event.client_payload.job_id || inputs.job_id }}"
